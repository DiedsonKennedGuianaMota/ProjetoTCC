<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fórum - ALGORITMOLAB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* [O SEU CSS ORIGINAL FOI MANTIDO AQUI - SEM ALTERAÇÕES] */
        :root { --primary-blue: #1c3d5a; --accent-teal: #2b6cb0; --bg-color: #f4f7f6; --card-bg: #ffffff; --text-main: #333333; --text-muted: #718096; --border-color: #e2e8f0; --fire-color: #ff9f43; --font-scale: 100%; }
        .high-contrast { --primary-blue: #00ebff; --accent-teal: #ffff00; --bg-color: #121212; --card-bg: #1e1e1e; --text-main: #ffffff; --text-muted: #a0aec0; --border-color: #4a5568; --fire-color: #ff3f34; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; transition: background 0.3s, color 0.3s, font-size 0.3s; }
        html { font-size: var(--font-scale); }
        body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; padding-bottom: 60px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes burn { 0% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(255,159,67,0.5)); } 50% { transform: scale(1.1); filter: drop-shadow(0 0 10px rgba(255,159,67,0.9)); } 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(255,159,67,0.5)); } }
        .navbar { background: var(--card-bg); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-bottom: 1px solid var(--border-color); }
        .nav-profile { display: flex; align-items: center; gap: 15px; }
        .avatar { width: 55px; height: 55px; background: var(--accent-teal); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; font-weight: 700; cursor: pointer; border: 3px solid var(--border-color); box-shadow: 0 4px 8px rgba(0,0,0,0.1); overflow: hidden; object-fit: cover; }
        .avatar:hover { transform: scale(1.05); border-color: var(--primary-blue); }
        .streak-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 159, 67, 0.15); color: var(--fire-color); padding: 3px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; margin-top: 2px; }
        .streak-badge i { animation: burn 1.5s infinite ease-in-out; }
        .container { max-width: 800px; margin: 0 auto; padding: 30px 20px; }
        .btn { padding: 10px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; text-decoration: none; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.95rem; width: 100%; }
        .btn-auto { width: auto; }
        .btn-primary { background: var(--accent-teal); color: white; }
        .btn-primary:hover { filter: brightness(1.1); }
        .btn-outline { background: transparent; color: var(--primary-blue); border: 2px solid var(--primary-blue); }
        .btn-outline:hover { background: var(--primary-blue); color: white; }
        .btn-logout { background: transparent; color: var(--text-main); border: 2px solid var(--border-color); }
        .btn-logout:hover { background: #e2e8f0; }
        .page-header { margin: 20px 0 30px 0; }
        .page-header h2 { color: var(--primary-blue); font-size: 2rem; display: flex; align-items: center; gap: 10px;}
        .create-post-box { background: var(--card-bg); padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); border: 1px solid var(--border-color); margin-bottom: 30px; }
        .post-textarea { width: 100%; border: none; resize: none; outline: none; background: transparent; color: var(--text-main); font-size: 1.05rem; min-height: 80px; }
        .post-actions-bar { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 15px; margin-top: 10px; }
        .btn-icon { background: rgba(43, 108, 176, 0.1); color: var(--accent-teal); border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 1rem; display: flex; align-items: center; gap: 5px; font-weight: 600;}
        .btn-icon:hover { background: rgba(43, 108, 176, 0.2); }
        #img-preview { max-width: 100%; max-height: 200px; border-radius: 10px; display: none; margin-top: 10px; object-fit: cover; }
        .feed-container { display: flex; flex-direction: column; gap: 25px; }
        .post-card { background: var(--card-bg); border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid var(--border-color); padding: 20px; animation: fadeIn 0.4s ease-out; }
        .post-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .post-avatar { width: 45px; height: 45px; background: var(--primary-blue); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; overflow: hidden; }
        .post-author { font-weight: 700; color: var(--primary-blue); font-size: 1.05rem;}
        .post-time { font-size: 0.8rem; color: var(--text-muted); }
        .post-content { color: var(--text-main); font-size: 1rem; line-height: 1.6; margin-bottom: 15px; }
        .post-image { width: 100%; border-radius: 10px; margin-bottom: 15px; max-height: 400px; object-fit: cover; }
        .post-footer { display: flex; gap: 15px; border-top: 1px solid var(--border-color); padding-top: 15px; }
        .interaction-btn { background: transparent; border: none; color: var(--text-muted); font-size: 1rem; display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; transition: color 0.2s;}
        .interaction-btn:hover, .interaction-btn.active { color: var(--accent-teal); }
        .comments-section { margin-top: 15px; background: var(--bg-color); padding: 15px; border-radius: 10px; display: none; }
        .comment-item { display: flex; gap: 10px; margin-bottom: 15px; }
        .comment-avatar { width: 35px; height: 35px; min-width: 35px; border-radius: 50%; background: var(--accent-teal); color: white; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; overflow: hidden;}
        .comment-bubble { background: var(--card-bg); padding: 10px 15px; border-radius: 15px; border: 1px solid var(--border-color); width: 100%; }
        .comment-author { font-weight: 700; font-size: 0.9rem; color: var(--primary-blue); }
        .comment-text { font-size: 0.9rem; color: var(--text-main); margin-top: 2px;}
        .add-comment-box { display: flex; gap: 10px; margin-top: 10px; }
        .comment-input { flex: 1; padding: 10px 15px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); outline: none; }
        .floating-actions { position: fixed; bottom: 25px; right: 25px; display: flex; flex-direction: column; gap: 10px; z-index: 99; }
        .btn-floating { width: 55px; height: 55px; border-radius: 50%; background: var(--primary-blue); color: white; box-shadow: 0 5px 15px rgba(0,0,0,0.2); justify-content: center; font-size: 1.3rem; display: flex; align-items: center; border: none; cursor: pointer;}
        .btn-floating:hover { background: var(--accent-teal); }
        .menu-acessibilidade { position: absolute; bottom: 65px; right: 0; background: var(--card-bg); border: 1px solid var(--border-color); padding: 15px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.15); display: none; flex-direction: column; gap: 10px; width: 230px; max-height: 400px; overflow-y: auto; }
        .menu-title { font-size: 0.9rem; font-weight: 700; color: var(--text-muted); text-align: center; margin-bottom: 5px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px;}
        .dyslexic-font * { font-family: 'Comic Sans MS', 'Arial', sans-serif !important; }
        .spacing-increased * { letter-spacing: 0.05em !important; line-height: 1.8 !important; }
        .highlight-links a { text-decoration: underline !important; font-weight: bold !important; color: var(--accent-teal) !important; padding: 2px 4px; border-radius: 4px; background: rgba(43, 108, 176, 0.1); }
        .high-contrast.highlight-links a { color: #ffff00 !important; background: rgba(255, 255, 0, 0.1); }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal-card { background: var(--card-bg); padding: 30px; border-radius: 20px; width: 90%; max-width: 450px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); }
        .modal-card h3 { margin-bottom: 20px; color: var(--primary-blue); }
        .avatar-presets { display: flex; justify-content: space-around; margin: 20px 0; }
        .preset-img { width: 60px; height: 60px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; }
        .preset-img:hover, .preset-img.selected { border-color: var(--accent-teal); transform: scale(1.1); }
        .input-text { width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 8px; margin-bottom: 15px; background: var(--bg-color); color: var(--text-main); }
        .post-action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; transition: color 0.2s;}
        .post-action-btn:hover { color: var(--primary-blue); }
        .post-action-delete:hover { color: red; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-profile">
            <div class="avatar" id="user-avatar" onclick="abrirModalAvatar()" title="Alterar Avatar"></div>
            <div>
                <strong id="user-name" style="font-size: 1.1rem;">Carregando...</strong>
                <div>
                    <div class="streak-badge"><i class="fas fa-fire"></i> <span id="user-streak">0 Dias</span></div>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        
        <a href="home.html" class="btn btn-outline btn-auto" style="margin-bottom: 10px;"><i class="fas fa-arrow-left"></i> Voltar ao Painel</a>

        <div class="page-header">
            <h2><i class="fas fa-comments"></i> Fórum da Comunidade</h2>
        </div>

        <div class="create-post-box">
            <textarea id="novo-post-texto" class="post-textarea" placeholder="Compartilhe uma dúvida, descoberta ou reflexão com a comunidade..."></textarea>
            <img id="img-preview" src="" alt="Pré-visualização">
            
            <div class="post-actions-bar">
                <input type="file" id="upload-imagem-post" accept="image/*" style="display: none;" onchange="previewImagemPost(event)">
                <button class="btn-icon" onclick="document.getElementById('upload-imagem-post').click()">
                    <i class="fas fa-image"></i> Anexar Foto
                </button>
                <button class="btn btn-primary btn-auto" onclick="publicarPost()" id="btn-publicar">Publicar</button>
            </div>
        </div>

        <div class="feed-container" id="feed-container">
            <div style="text-align:center; color: var(--text-muted); padding: 40px;"><i class="fas fa-spinner fa-spin fa-2x"></i><br>Carregando discussões...</div>
        </div>

    </main>

    <div class="floating-actions">
        <div class="menu-acessibilidade" id="menu-acess">
            <div class="menu-title">Opções de Visualização</div>
            <button class="btn btn-primary" onclick="toggleAltoContraste()"><i class="fas fa-adjust"></i> Alto Contraste</button>
            <button class="btn btn-logout" onclick="mudarFonte(2)"><i class="fas fa-font"></i><i class="fas fa-plus"></i> Aumentar Texto</button>
            <button class="btn btn-logout" onclick="mudarFonte(-2)"><i class="fas fa-font"></i><i class="fas fa-minus"></i> Diminuir Texto</button>
            <button class="btn btn-logout" onclick="toggleDislexia()"><i class="fas fa-book-reader"></i> Fonte Dislexia</button>
            <button class="btn btn-logout" onclick="toggleEspacamento()"><i class="fas fa-text-height"></i> Mais Espaçamento</button>
            <button class="btn btn-logout" onclick="toggleDestaqueLinks()"><i class="fas fa-link"></i> Destacar Links</button>
        </div>
        <button class="btn btn-floating" onclick="toggleMenuAcessibilidade()" title="Acessibilidade"><i class="fas fa-universal-access"></i></button>
    </div>

    <div class="modal-overlay" id="avatar-modal">
        <div class="modal-card">
            <h3><i class="fas fa-camera"></i> Alterar Foto de Perfil</h3>
            <div class="avatar-presets">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Felix" class="preset-img" onclick="selecionarPreset(this.src)">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Ane" class="preset-img" onclick="selecionarPreset(this.src)">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Jack" class="preset-img" onclick="selecionarPreset(this.src)">
            </div>
            <p style="font-size: 0.9rem; margin-bottom: 5px; color: var(--text-muted);">Ou cole a URL de uma imagem:</p>
            <input type="text" id="avatar-url" class="input-text" placeholder="https://linkdafoto.com/foto.jpg">
            <p style="font-size: 0.9rem; margin-bottom: 5px; color: var(--text-muted);">Ou envie do seu computador:</p>
            <input type="file" id="avatar-file" accept="image/*" onchange="carregarArquivoLocal(event)" style="margin-bottom: 20px;">
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button class="btn btn-logout btn-auto" onclick="fecharModalAvatar()">Cancelar</button>
                <button class="btn btn-primary btn-auto" onclick="salvarNovaFoto()" id="btn-salvar-foto">Salvar Foto</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://algoritmolab.onrender.com/api';
        let usuarioLogadoData = null; 
        let fotoSelecionadaTemp = "";
        let imagemPostBase64 = "";

        // CHECAGEM DE AUTENTICAÇÃO
        function checkAuth() {
            const userString = localStorage.getItem('userData');
            if (!userString) { window.location.href = 'index.html'; return; }
            usuarioLogadoData = JSON.parse(userString);
            renderizarDadosUsuario();
            carregarPostsReais(); 
        }

        function renderizarDadosUsuario() {
            document.getElementById('user-name').innerText = usuarioLogadoData.nome;
            document.getElementById('user-streak').innerText = `${usuarioLogadoData.streak || 0} Dias`;
            const avatarDiv = document.getElementById('user-avatar');
            if (usuarioLogadoData.foto && usuarioLogadoData.foto !== "") {
                avatarDiv.innerHTML = `<img src="${usuarioLogadoData.foto}" style="width:100%; height:100%; object-fit:cover;">`;
            } else {
                avatarDiv.innerText = usuarioLogadoData.nome.charAt(0).toUpperCase();
            }
        }

        // CARREGAR POSTS DO BANCO
        async function carregarPostsReais() {
            const container = document.getElementById('feed-container');
            try {
                const response = await fetch(`${API_URL}/forum/posts`);
                if (!response.ok) throw new Error("Erro no servidor ao buscar posts.");
                
                const posts = await response.json();
                container.innerHTML = ''; 
                
                if(!Array.isArray(posts)) { container.innerHTML = `<div style="text-align:center; padding: 40px;">Nenhum post encontrado.</div>`; return; }
                if(posts.length === 0) { container.innerHTML = `<div style="text-align:center; color: var(--text-muted); padding: 40px;">Nenhum post encontrado. Seja o primeiro a postar!</div>`; return; }

                posts.forEach(post => {
                    container.innerHTML += criarHTMLdoPost(post);
                });
            } catch (error) {
                console.error("Erro ao buscar posts:", error);
                container.innerHTML = `<div style="text-align:center; color: red; padding: 40px;">Erro de conexão com o banco de dados. Verifique o backend.</div>`;
            }
        }

        function previewImagemPost(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onloadend = function() {
                imagemPostBase64 = reader.result;
                const preview = document.getElementById('img-preview');
                preview.src = imagemPostBase64;
                preview.style.display = 'block';
            }
            if (file) reader.readAsDataURL(file);
        }

        async function publicarPost() {
            const texto = document.getElementById('novo-post-texto').value.trim();
            if(!texto && !imagemPostBase64) { alert("Escreva algo ou anexe uma imagem para postar."); return; }

            const btnPublicar = document.getElementById('btn-publicar');
            btnPublicar.innerText = "Publicando..."; btnPublicar.disabled = true;

            const postData = {
                user_email: usuarioLogadoData.email,
                user_nome: usuarioLogadoData.nome,
                user_foto: usuarioLogadoData.foto,
                conteudo: texto,
                imagem_url: imagemPostBase64
            };

            try {
                const response = await fetch(`${API_URL}/forum/post`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(postData) });
                if (response.ok) {
                    document.getElementById('novo-post-texto').value = '';
                    document.getElementById('img-preview').style.display = 'none';
                    imagemPostBase64 = '';
                    carregarPostsReais();
                } else { alert("Erro ao publicar postagem."); }
            } catch(e) { console.error(e); alert("Falha na comunicação com o servidor."); } 
            finally { btnPublicar.innerText = "Publicar"; btnPublicar.disabled = false; }
        }

        // --- NOVAS FUNÇÕES: CURTIR, EDITAR E DELETAR ---

        async function curtirPost(postId) {
            try {
                const response = await fetch(`${API_URL}/forum/post/${postId}/like`, { 
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    // Agora enviamos o email do usuário logado para o servidor conferir!
                    body: JSON.stringify({ user_email: usuarioLogadoData.email }) 
                });
                
                if (response.ok) {
                    carregarPostsReais(); // Atualiza a tela para mostrar a contagem certa
                }
            } catch(e) { 
                console.error("Erro ao curtir:", e); 
            }
        }

        async function deletarPost(postId) {
            if(!confirm("Tem certeza que deseja apagar este post? Isso não pode ser desfeito.")) return;
            try {
                const response = await fetch(`${API_URL}/forum/post/${postId}`, { method: 'DELETE' });
                if (response.ok) carregarPostsReais();
                else alert("Erro ao deletar o post.");
            } catch(e) { console.error("Erro ao deletar:", e); }
        }

        async function editarPost(postId, conteudoAtual) {
            const novoConteudo = prompt("Edite sua postagem:", conteudoAtual);
            if(novoConteudo === null || novoConteudo.trim() === "") return; // Cancelou ou deixou vazio
            
            try {
                const response = await fetch(`${API_URL}/forum/post/${postId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ conteudo: novoConteudo })
                });
                if (response.ok) carregarPostsReais();
                else alert("Erro ao editar o post.");
            } catch(e) { console.error("Erro ao editar:", e); }
        }

        // -----------------------------------------------

        async function enviarComentario(event, postId) {
            if (event.key !== 'Enter') return;
            const input = event.target;
            const texto = input.value.trim();
            if (!texto) return;

            input.disabled = true;
            const commentData = { post_id: postId, user_email: usuarioLogadoData.email, user_nome: usuarioLogadoData.nome, user_foto: usuarioLogadoData.foto, comentario: texto };

            try {
                const response = await fetch(`${API_URL}/forum/comment`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(commentData) });
                if(response.ok) carregarPostsReais();
                else { alert("Erro ao enviar comentário."); input.disabled = false; }
            } catch(e) { console.error(e); alert("Erro de conexão ao comentar."); input.disabled = false; }
        }

        function toggleComentarios(postId) {
            const sec = document.getElementById(`comentarios-${postId}`);
            sec.style.display = sec.style.display === 'block' ? 'none' : 'block';
        }

        function formatarData(dataISO) {
            if (!dataISO) return "Agora mesmo";
            const data = new Date(dataISO);
            return data.toLocaleDateString('pt-BR') + ' às ' + data.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
        }

        function criarHTMLdoPost(post) {
            const imgHTML = post.imagem_url ? `<img src="${post.imagem_url}" class="post-image" alt="Imagem do post">` : '';
            const fotoTag = post.user_foto ? `<img src="${post.user_foto}" style="width:100%; height:100%; object-fit:cover;">` : post.user_nome.charAt(0);
            
            // Lógica para mostrar botões de Editar/Deletar APENAS se o usuário logado for o dono do post
            const isDonoDoPost = post.user_email === usuarioLogadoData.email;
            let acoesHTML = '';
            if (isDonoDoPost) {
                // Passamos o conteúdo atual escapado para o prompt da função de editar
                const conteudoEscapado = post.conteudo.replace(/"/g, '&quot;').replace(/'/g, "\\'");
                acoesHTML = `
                    <div style="margin-left: auto; display: flex; gap: 12px;">
                        <button class="post-action-btn" onclick="editarPost(${post.id}, '${conteudoEscapado}')" title="Editar Post"><i class="fas fa-edit"></i></button>
                        <button class="post-action-btn post-action-delete" onclick="deletarPost(${post.id})" title="Apagar Post"><i class="fas fa-trash-alt"></i></button>
                    </div>
                `;
            }

            let comentariosHTML = '';
            if(post.comentarios && post.comentarios.length > 0) {
                post.comentarios.forEach(c => {
                    const avatarC = c.user_foto ? `<img src="${c.user_foto}" style="width:100%; height:100%; object-fit:cover;">` : c.user_nome.charAt(0);
                    comentariosHTML += `
                    <div class="comment-item">
                        <div class="comment-avatar">${avatarC}</div>
                        <div class="comment-bubble">
                            <div class="comment-author">${c.user_nome}</div>
                            <div class="comment-text">${c.comentario}</div>
                        </div>
                    </div>`;
                });
            } else {
                comentariosHTML = `<p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:10px;">Seja o primeiro a comentar.</p>`;
            }
            
            return `
            <div class="post-card" id="post-${post.id}">
                <div class="post-header">
                    <div class="post-avatar">${fotoTag}</div>
                    <div>
                        <div class="post-author">${post.user_nome}</div>
                        <div class="post-time">${formatarData(post.criado_em)}</div>
                    </div>
                    ${acoesHTML}
                </div>
                <div class="post-content">${post.conteudo.replace(/\n/g, '<br>')}</div>
                ${imgHTML}
                
                <div class="post-footer">
                    <button class="interaction-btn" onclick="curtirPost(${post.id})"><i class="far fa-heart"></i> ${post.curtidas || 0} Curtidas</button>
                    
                    <button class="interaction-btn" onclick="toggleComentarios(${post.id})"><i class="far fa-comment"></i> ${post.comentarios ? post.comentarios.length : 0} Comentários</button>
                </div>

                <div class="comments-section" id="comentarios-${post.id}">
                    <div id="lista-comentarios-${post.id}">
                        ${comentariosHTML}
                    </div>
                    <div class="add-comment-box">
                        <input type="text" class="comment-input" placeholder="Escreva um comentário e aperte Enter..." onkeypress="enviarComentario(event, ${post.id})">
                    </div>
                </div>
            </div>`;
        }

        /* ACESSIBILIDADE MANTIDA */
        function abrirModalAvatar() { document.getElementById('avatar-modal').style.display = 'flex'; }
        function fecharModalAvatar() { document.getElementById('avatar-modal').style.display = 'none'; }
        function selecionarPreset(src) { fotoSelecionadaTemp = src; document.querySelectorAll('.preset-img').forEach(img => img.classList.remove('selected')); event.target.classList.add('selected'); }
        function carregarArquivoLocal(event) { const file = event.target.files[0]; const reader = new FileReader(); reader.onloadend = function() { fotoSelecionadaTemp = reader.result; }; if (file) reader.readAsDataURL(file); }

        function toggleMenuAcessibilidade() { const menu = document.getElementById('menu-acess'); menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex'; }
        function toggleAltoContraste() { document.body.classList.toggle('high-contrast'); localStorage.setItem('acess_alto_contraste', document.body.classList.contains('high-contrast')); }
        let currentScale = 100;
        function mudarFonte(delta) { currentScale += delta; if(currentScale < 80) currentScale = 80; if(currentScale > 140) currentScale = 140; document.documentElement.style.setProperty('--font-scale', `${currentScale}%`); localStorage.setItem('acess_escala_fonte', currentScale); }
        function toggleDislexia() { document.body.classList.toggle('dyslexic-font'); localStorage.setItem('acess_dislexia', document.body.classList.contains('dyslexic-font')); }
        function toggleEspacamento() { document.body.classList.toggle('spacing-increased'); localStorage.setItem('acess_espacamento', document.body.classList.contains('spacing-increased')); }
        function toggleDestaqueLinks() { document.body.classList.toggle('highlight-links'); localStorage.setItem('acess_links', document.body.classList.contains('highlight-links')); }

        window.onload = function() {
            checkAuth();
            if (localStorage.getItem('acess_alto_contraste') === 'true') document.body.classList.add('high-contrast');
            if (localStorage.getItem('acess_dislexia') === 'true') document.body.classList.add('dyslexic-font');
            if (localStorage.getItem('acess_espacamento') === 'true') document.body.classList.add('spacing-increased');
            if (localStorage.getItem('acess_links') === 'true') document.body.classList.add('highlight-links');
            const savedScale = localStorage.getItem('acess_escala_fonte');
            if (savedScale) { currentScale = parseInt(savedScale); document.documentElement.style.setProperty('--font-scale', `${currentScale}%`); }
        };
    </script>
</body>
</html>
