<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3FBF">
<title>Questionário pós-intervenção · EJA</title>
<style>
:root{--bg:#EAF3FF;--card:#fff;--ink:#101936;--muted:#34406A;--brand:#1F3FBF;--brandInk:#fff;--accent:#FFC93C;--ok:#0B7A4B;--err:#B3261E;--soft:#DCE8FF;font-size:20px;color-scheme:light}
:root[data-theme=dark]{--bg:#0B1230;--card:#16204A;--ink:#fff;--muted:#C9D3F5;--brand:#FFC93C;--brandInk:#101936;--accent:#5CE1E6;--ok:#5FE3A1;--err:#FF9A93;--soft:#222E63;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Verdana,sans-serif;line-height:1.55;min-height:100vh}
:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.wrap{max-width:760px;margin:auto;padding:16px 16px 80px}.tools{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;cursor:pointer}.tools button,.mic{font-size:.85rem;font-weight:bold;min-height:46px;padding:8px 14px;border-radius:12px;border:2px solid var(--brand);background:var(--card);color:var(--ink)}
header{display:flex;gap:14px;align-items:center;margin:10px 0 18px}.bot{font-size:3rem}.bubble{background:var(--accent);color:#101936;font-weight:bold;padding:12px 16px;border-radius:18px}
h1{font-size:1.5rem;line-height:1.25;margin:0 0 12px}.prog{height:20px;background:var(--soft);border:2px solid var(--brand);border-radius:30px;overflow:hidden}.prog div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .3s}
.plabel{font-weight:bold;color:var(--muted);margin:8px 0 18px}.card{background:var(--card);border:3px solid var(--brand);border-radius:22px;padding:22px 18px;box-shadow:0 7px 0 var(--brand)}
h2{font-size:1.4rem;margin:0 0 16px}.q{margin:0 0 26px;border:0;padding:0}.q legend,.q label.t{display:block;font-size:1.1rem;font-weight:bold;margin-bottom:12px}
.hint{font-weight:normal;color:var(--muted);font-size:.9rem}.opt{display:flex;gap:12px;align-items:center;min-height:58px;padding:11px 14px;margin:9px 0;border:2px solid var(--muted);border-radius:14px;background:var(--card);cursor:pointer}
.opt input{width:26px;height:26px;flex:none;accent-color:var(--brand)}.opt:has(input:checked){border-color:var(--brand);background:var(--soft);font-weight:bold}
textarea,input[type=text]{width:100%;font:inherit;padding:13px;border:2px solid var(--muted);border-radius:13px;background:var(--card);color:var(--ink)}textarea{min-height:120px;resize:vertical}
.nav{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}.btn{font-weight:bold;min-height:58px;padding:10px 20px;border-radius:15px;border:2px solid var(--brand);background:var(--card);color:var(--ink);flex:1 1 140px}.btn.go{background:var(--brand);color:var(--brandInk)}.btn.save{background:var(--ok);border-color:var(--ok);color:white}.btn:disabled{opacity:.5}
.err{color:var(--err);font-weight:bold;margin-top:10px}.done{text-align:center}.done .big{font-size:4rem}.done pre{white-space:pre-wrap;text-align:left;font:inherit;font-size:.9rem}
.owner{position:fixed;right:12px;bottom:12px;z-index:5;background:var(--accent);color:#101936;border:2px solid var(--ink);border-radius:30px;padding:12px 18px;font-weight:bold}
.panel{position:fixed;inset:0;z-index:10;background:var(--bg);overflow:auto;padding:18px}.panel .in{max-width:850px;margin:auto}details{background:var(--card);border:2px solid var(--brand);border-radius:14px;margin:12px 0;padding:12px}summary{font-weight:bold;cursor:pointer}details dd{margin:4px 0 12px} .actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
@media(max-width:480px){:root{font-size:18px}.card{padding:18px 14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body{background:white;color:black}.tools,.owner,.nav,.no-print{display:none!important}.wrap{max-width:none;padding:0}.card{box-shadow:none;border:0}.panel{position:static;background:white;color:black}.panel[hidden]{display:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="tools" aria-label="Ajustes de leitura">
    <button type="button" id="aMenos">A−</button><button type="button" id="aMais">A+</button><button type="button" id="tema">🌓 Contraste</button>
  </div>
  <header><div class="bot" aria-hidden="true">🤖</div><div class="bubble" id="fala" aria-live="polite">Olá! Vamos começar com calma. 😊</div></header>
  <h1>Conte como foi a nossa experiência</h1>
  <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="prog"><div id="bar"></div></div>
  <div class="plabel" id="plabel"></div>
  <section class="card" id="stage" aria-live="polite"></section>
</main>
<button type="button" class="owner" id="ownerBtn">📋 Área do pesquisador</button>
<section class="panel" id="panel" hidden role="dialog" aria-label="Respostas salvas"><div class="in" id="panelIn"></div></section>

<script>
"use strict";
/* DADOS DA PESQUISA */
const PESQUISA={
 titulo:"A criação de jogos como ferramenta para o desenvolvimento do pensamento computacional no ensino EJA",
 responsavel:"Prof. Diedson Kenned Guiana Mota",
 instituicao:"Universidade do Estado do Amazonas (UEA)",
 contato:"dkgm.lic20@uea.edu.br · (92) 98421-9571"
};
const STORAGE_KEY="questionario_eja_respostas_v1";
const ESCALA=["Concordo muito","Concordo um pouco","Discordo um pouco","Discordo muito"];
const SECOES=[
{id:"tcle",titulo:"Termo de Consentimento",icone:"📝",fala:"Olá! Vamos começar com calma. 😊"},
{id:"perfil",titulo:"Parte 1: Perfil",icone:"🙋",fala:"Queremos conhecer você um pouquinho!",qs:[
{id:"p1",t:"one",q:"Qual é a sua idade?",o:["18 a 29 anos","30 a 44 anos","45 a 59 anos","60 anos ou mais"]},
{id:"p2",t:"one",q:"Com qual gênero você se identifica?",o:["Feminino","Masculino","Outro / prefiro não dizer"]},
{id:"p3",t:"one",q:"Em qual etapa da EJA você estuda?",o:["Anos iniciais (alfabetização)","Anos finais (6º ao 9º ano)","Ensino Médio"]},
{id:"p4",t:"one",q:"Você trabalha atualmente?",o:["Sim, com carteira assinada","Sim, por conta própria / informal","Não trabalho","Sou aposentado(a)"]}]},
{id:"jogos",titulo:"Parte 2: Jogos no dia a dia",icone:"🎲",fala:"Jogar também é aprender!",qs:[
{id:"j1",t:"one",q:"Com que frequência você joga (celular, dominó, cartas, bingo, videogame…)?",o:["Todos os dias","Algumas vezes na semana","Raramente","Nunca jogo"]},
{id:"j2",t:"multi",q:"Quais jogos você costuma jogar?",h:"Pode marcar mais de um.",o:["Jogos de celular","Dominó, cartas ou damas","Bingo","Videogame","Nenhum"]},
{id:"j3",t:"one",q:"Com quem você costuma jogar?",o:["Com a família","Com amigos","Sozinho(a)","Não jogo com ninguém"]},
{id:"j4",t:"one",q:"“Jogar ajuda a pensar melhor.” Você…",o:ESCALA}]},
{id:"tec",titulo:"Parte 3: Tecnologia",icone:"📱",fala:"Agora vamos falar de tecnologia.",qs:[
{id:"t1",t:"multi",q:"Quais aparelhos você usa?",h:"Pode marcar mais de um.",o:["Celular","Computador","Tablet","Nenhum"]},
{id:"t2",t:"one",q:"Como você se sente ao usar tecnologia?",o:["Muito à vontade","Mais ou menos","Com dificuldade","Quase não uso"]},
{id:"t3",t:"multi",q:"Para que você usa a internet?",h:"Pode marcar mais de um.",o:["WhatsApp e redes sociais","Vídeos e músicas","Banco e serviços","Pesquisar e estudar","Não uso internet"]},
{id:"t4",t:"one",q:"“Depois das atividades, me sinto mais confiante com a tecnologia.” Você…",o:ESCALA},
{id:"t5",t:"one",q:"Você sabe procurar uma informação na internet?",o:["Sim, com facilidade","Sim, com ajuda de alguém","Não sei fazer","Não uso internet"]},
{id:"t6",t:"one",q:"Você já usou algum aplicativo para aprender ou estudar?",o:["Sim, várias vezes","Sim, poucas vezes","Nunca usei","Não sei o que é"]}]},
{id:"pc",titulo:"Parte 4: Vamos pensar?",icone:"🧩",fala:"Sem pressão! Se não souber, tudo bem.",qs:[
{id:"c1",t:"one",ok:0,q:"Para fazer um bolo difícil, qual é a melhor forma de começar?",o:["Dividir a receita em pequenas etapas","Misturar tudo de uma vez","Esperar o forno esquentar sem fazer nada","Não sei"]},
{id:"c2",t:"one",ok:1,q:"Veja a sequência: ⭐ 🌙 ⭐ 🌙 ⭐ … Qual figura vem depois?",o:["⭐","🌙","☀️","Não sei"]},
{id:"c3",t:"one",ok:2,q:"Qual é a ordem correta para lavar as mãos?",o:["Secar, ensaboar, molhar, enxaguar","Ensaboar, secar, molhar, enxaguar","Molhar, ensaboar, esfregar, enxaguar, secar","Não sei"]},
{id:"c4",t:"one",ok:1,q:"Um robô seguiu as ordens “ande 3 passos, vire à direita, ande 2 passos”, mas chegou ao lugar errado. O que fazer?",o:["Jogar o robô fora","Procurar o erro nas ordens e corrigir","Repetir as mesmas ordens sem mudar","Não sei"]},
{id:"c5",t:"one",ok:1,q:"Um robô repete 4 vezes: “ande 1 passo e vire à direita”. Quantos passos ele anda no total?",o:["1 passo","4 passos","8 passos","Não sei"]},
{id:"c6",t:"one",ok:1,q:"Regra: SE estiver chovendo, levo o guarda-chuva; SE NÃO estiver, deixo em casa. Hoje o sol está forte. O que fazer?",o:["Levar o guarda-chuva","Deixar o guarda-chuva em casa","Levar dois guarda-chuvas","Não sei"]}]},
{id:"op",titulo:"Parte 5: Sua opinião",icone:"💬",fala:"Sua opinião é muito importante! 💛",qs:[
{id:"o1",t:"text",q:"O que você mais gostou nas atividades?"},
{id:"o2",t:"text",q:"O que foi mais difícil para você?"},
{id:"o3",t:"text",q:"O que você aprendeu que pode usar no seu dia a dia?"},
{id:"o4",t:"text",q:"O que podemos melhorar nas próximas aulas?"}]}
];
const $=s=>document.querySelector(s);
const make=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e};
const TOTAL_PC=SECOES.flatMap(s=>s.qs||[]).filter(q=>q.ok!==undefined).length;
let step=0,answers={},apelido="",aceite=false,fontSize=20;
const stage=$("#stage");
$("#aMais").onclick=()=>{fontSize=Math.min(30,fontSize+2);document.documentElement.style.fontSize=fontSize+"px"};
$("#aMenos").onclick=()=>{fontSize=Math.max(16,fontSize-2);document.documentElement.style.fontSize=fontSize+"px"};
$("#tema").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="dark"?"light":"dark"};

function atualizarProgresso(){
 const pct=Math.round(step/SECOES.length*100);
 $("#bar").style.width=Math.max(5,pct)+"%";$("#prog").setAttribute("aria-valuenow",pct);
 $("#plabel").textContent=step<SECOES.length?`Etapa ${step+1} de ${SECOES.length}: ${SECOES[step].titulo}`:"Questionário concluído!";
}
function render(){
 stage.replaceChildren();atualizarProgresso();
 if(step>=SECOES.length){renderFinal();return}
 const s=SECOES[step];$("#fala").textContent=s.fala;
 stage.append(make("h2",null,`${s.icone} ${s.titulo}`));
 if(s.id==="tcle")renderTCLE();else s.qs.forEach((q,i)=>stage.append(renderPergunta(q,i+1)));
 const error=make("div","err");error.id="err";error.setAttribute("role","alert");stage.append(error);
 const nav=make("div","nav");
 if(step>0){const back=make("button","btn","← Voltar");back.type="button";back.onclick=()=>go(-1);nav.append(back)}
 const next=make("button","btn go",step===SECOES.length-1?"💾 Salvar questionário":"Próxima etapa →");
 next.type="button";next.onclick=()=>{if(step===SECOES.length-1)salvar();else if(validar())go(1)};
 nav.append(next);stage.append(nav);
}
function renderTCLE(){
 const box=make("div","tcle");
 [
`Você está sendo convidado(a) a participar da pesquisa “${PESQUISA.titulo}”, conduzida por ${PESQUISA.responsavel} (${PESQUISA.instituicao}).`,
"Objetivo: saber o que você aprendeu e o que achou das atividades com jogos e tecnologia feitas nas aulas.",
"Sua participação é voluntária. Você pode parar a qualquer momento, sem nenhum prejuízo nas aulas ou na escola.",
"Não existem respostas certas ou erradas na opinião. Os riscos são pequenos: cansaço ou algum constrangimento. Se isso acontecer, pode parar.",
"Seus dados são sigilosos. Só o professor pesquisador terá acesso e seu nome não aparecerá em nenhum resultado.",
`Dúvidas? Fale com ${PESQUISA.responsavel}: ${PESQUISA.contato}.`
 ].forEach(t=>box.append(make("p",null,t)));
 stage.append(box);
 const lab=make("label","opt"),cb=make("input");cb.type="checkbox";cb.checked=aceite;cb.onchange=()=>aceite=cb.checked;
 lab.append(cb,make("span",null,"Li e concordo em participar da pesquisa."));stage.append(lab);
 const w=make("div","q"),l=make("label","t","Seu nome ou apelido (opcional)"),inp=make("input");
 inp.type="text";inp.value=apelido;inp.autocomplete="off";inp.oninput=()=>apelido=inp.value;
 w.append(l,inp);w.style.marginTop="18px";stage.append(w);
}
function renderPergunta(q,n){
 if(q.t==="text"){
  const w=make("div","q"),l=make("label","t",`${n}. ${q.q}`),ta=make("textarea");
  ta.value=answers[q.id]||"";ta.oninput=()=>answers[q.id]=ta.value;w.append(l,ta);return w;
 }
 const f=make("fieldset","q"),lg=make("legend",null,`${n}. ${q.q} `);
 if(q.h)lg.append(make("span","hint",q.h));f.append(lg);
 q.o.forEach(option=>{
  const lab=make("label","opt"),input=make("input");input.type=q.t==="multi"?"checkbox":"radio";input.name=q.id;input.value=option;
  input.checked=q.t==="multi"?(answers[q.id]||[]).includes(option):answers[q.id]===option;
  input.onchange=()=>{if(q.t==="multi")answers[q.id]=[...f.querySelectorAll("input:checked")].map(x=>x.value);else answers[q.id]=option;$("#err").textContent=""};
  lab.append(input,make("span",null,option));f.append(lab);
 });
 f.dataset.id=q.id;return f;
}
function validar(){
 const s=SECOES[step];$("#err").textContent="";
 if(s.id==="tcle"){if(!aceite){$("#err").textContent="Para continuar, marque a caixinha “Li e concordo”.";return false}return true}
 for(const q of s.qs){if(q.t==="text")continue;const a=answers[q.id];if(!a||(Array.isArray(a)&&!a.length)){
  const f=stage.querySelector(`[data-id="${q.id}"]`);if(f)f.scrollIntoView({behavior:"smooth",block:"center"});
  $("#err").textContent="Falta responder uma pergunta. Marque uma opção para continuar.";return false;
 }}
 return true;
}
function go(d){step+=d;render();window.scrollTo({top:0,behavior:"smooth"})}
function montarPacote(){
 const respostas={};let acertos=0;
 SECOES.forEach(s=>(s.qs||[]).forEach(q=>{const a=answers[q.id];respostas[q.id]=Array.isArray(a)?a.join(" | "):(a||"");if(q.ok!==undefined&&a===q.o[q.ok])acertos++}));
 return {id:Date.now().toString(),ts:new Date().toISOString(),apelido:apelido.trim(),respostas,acertos,totalPC:TOTAL_PC};
}
function lerBanco(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]")}catch(e){return []}}
function gravarBanco(lista){localStorage.setItem(STORAGE_KEY,JSON.stringify(lista))}
function salvar(){
 if(!validar())return;
 const pacote=montarPacote();
 try{const lista=lerBanco();lista.push(pacote);gravarBanco(lista);renderFinal()}
 catch(e){$("#err").textContent="O navegador não permitiu salvar. Verifique se o armazenamento do site está habilitado e tente novamente."}
}
function espelho(d){
 const L=["QUESTIONÁRIO PÓS-INTERVENÇÃO (EJA)",`Participante: ${d.apelido||"sem nome"}`,`Data: ${new Date(d.ts).toLocaleString("pt-BR")}`,`Acertos em pensamento computacional: ${d.acertos}/${d.totalPC}`,""];
 SECOES.forEach(s=>{if(!s.qs)return;L.push(`== ${s.titulo} ==`);s.qs.forEach(q=>L.push(q.q,`R: ${d.respostas[q.id]||"—"}`,""))});
 return L.join("\n");
}
function renderFinal(){
 $("#fala").textContent="Muito obrigado! 🎉";const d=make("div","done");
 d.append(make("div","big", "🏆"),make("h2",null,"Questionário salvo neste dispositivo!"),make("p",null,"Obrigado por participar. Sua opinião ajuda a melhorar as aulas."));
 d.append(make("p",null,"Se precisar entregar suas respostas ao professor, use o botão abaixo para imprimir ou salvar em PDF."));
 const b=make("button","btn go","⬇ Baixar / imprimir minhas respostas em PDF");b.onclick=()=>imprimirRespostas([montarPacote()]);d.append(b);
 const detail=make("details"),summary=make("summary",null,"Ver minhas respostas"),pre=make("pre",null,espelho(montarPacote()));detail.append(summary,pre);d.append(detail);
 stage.replaceChildren(d);atualizarProgresso();
}
function imprimirRespostas(lista){
 const w=window.open("","_blank");if(!w){alert("Permita pop-ups para gerar o PDF.");return}
 const conteudo=lista.map(d=>`<article><h1>Questionário pós-intervenção · EJA</h1><p><b>Participante:</b> ${escapar(d.apelido||"sem nome")}</p><p><b>Data:</b> ${new Date(d.ts).toLocaleString("pt-BR")}</p><p><b>Acertos:</b> ${d.acertos}/${d.totalPC}</p><pre>${escapar(espelho(d))}</pre></article>`).join("<hr>");
 w.document.write(`<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Respostas EJA</title><style>body{font:14px Arial;margin:30px;color:#17203b}h1{font-size:20px}pre{white-space:pre-wrap;font:13px Arial;line-height:1.5}article{page-break-after:always}@media print{button{display:none}}</style><body>${conteudo}<script>window.onload=()=>window.print()<\/script></body></html>`);
 w.document.close();
}
function escapar(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

/* PAINEL LOCAL DO PESQUISADOR */
$("#ownerBtn").onclick=abrirPainel;
function abrirPainel(){
 const panel=$("#panel"),inn=$("#panelIn");panel.hidden=false;inn.replaceChildren();
 const actions=make("div","actions");
 const close=make("button","tools","✕ Fechar");close.onclick=()=>panel.hidden=true;
 const csv=make("button","tools","⬇ Baixar CSV");csv.onclick=baixarCSV;
 const pdf=make("button","tools","⬇ PDF de todos");pdf.onclick=()=>{const ds=lerBanco();if(ds.length)imprimirRespostas(ds);else alert("Ainda não há respostas salvas.")};
 const limpar=make("button","tools","Apagar respostas deste dispositivo");limpar.onclick=()=>{if(confirm("Tem certeza de que deseja apagar todas as respostas salvas neste navegador?")){gravarBanco([]);abrirPainel()}};
 actions.append(csv,pdf,limpar,close);inn.append(actions,make("h1",null,"Respostas salvas neste dispositivo"));
 const ds=lerBanco(),media=ds.length?(ds.reduce((s,d)=>s+(d.acertos||0),0)/ds.length).toFixed(1):"0";
 inn.append(make("p","plabel",`${ds.length} questionário(s) · média de acertos: ${media} de ${TOTAL_PC}`));
 if(!ds.length)inn.append(make("p",null,"Nenhuma resposta salva neste navegador."));
 ds.slice().reverse().forEach(d=>{
  const det=make("details"),sum=make("summary",null,`${new Date(d.ts).toLocaleString("pt-BR")} · ${d.apelido||"sem nome"} · acertos: ${d.acertos}/${d.totalPC}`);
  const pre=make("pre",null,espelho(d));pre.style.whiteSpace="pre-wrap";det.append(sum,pre);inn.append(det);
 });
}
function baixarCSV(){
 const ds=lerBanco();if(!ds.length){alert("Ainda não há respostas salvas.");return}
 const ids=SECOES.flatMap(s=>(s.qs||[]).map(q=>q.id));
 const esc=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
 const linhas=[["data","apelido","acertos",...ids].map(esc).join(",")];
 ds.forEach(d=>linhas.push([new Date(d.ts).toLocaleString("pt-BR"),d.apelido,d.acertos,...ids.map(id=>d.respostas[id])].map(esc).join(",")));
 const blob=new Blob(["\ufeff"+linhas.join("\r\n")],{type:"text/csv;charset=utf-8"});
 const url=URL.createObjectURL(blob),a=make("a");a.href=url;a.download="respostas-questionario-eja.csv";a.click();URL.revokeObjectURL(url);
}
render();
</script>
</body>
</html>
