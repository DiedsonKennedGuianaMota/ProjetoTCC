<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material de Estudo - ALGORITMOLAB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-profile">
            <div class="avatar" id="user-avatar">A</div>
            <div>
                <strong id="user-name">Aluno</strong>
                <div class="streak-badge">
                    <i class="fas fa-fire"></i> <span id="user-streak">0 Dias</span>
                </div>
            </div>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-outline" onclick="abrirConfiguracoes()" style="background: transparent; color: var(--primary-blue); box-shadow: none; border: 2px solid var(--primary-blue);" title="Configurações">
                <i class="fas fa-cog"></i>
            </button>
            <button class="btn btn-outline" onclick="handleLogout()" style="background: transparent; color: var(--primary-blue); box-shadow: none; border: 2px solid var(--primary-blue);" title="Sair">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </header>

    <main class="container">
        <h2 style="margin-bottom: 30px; color: var(--primary-blue);">
            <i class="fas fa-book-reader"></i> Material de Estudo - Unidade 1
        </h2>
        
        <div class="material-grid">
            
            <div class="material-card">
                <div class="material-header">
                    <h3><i class="fas fa-video"></i> Videoaula: Introdução à Lógica</h3>
                    <div class="status-check">
                        <i class="far fa-square check-icon" id="check-video"></i>
                    </div>
                </div>
                
                <div class="video-container" style="position: relative; padding-bottom: 56.25%; height: 0;">
                    <iframe src="https://www.youtube.com/embed/jBIPvXHRYpg?si=DYU68or2lixYtoHw" 
                            title="YouTube video player" 
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen
                            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 8px;">
                    </iframe>
                </div>
                
                <button class="btn bg-teal btn-animate" onclick="marcarVideoConcluido()" style="width: 100%; margin-top: 15px; justify-content: center; color: var(--primary-blue);">
                    <i class="fas fa-check-circle"></i> Marcar como Assistida
                </button>
            </div>

            <div class="material-card">
                <div class="material-header">
                    <h3><i class="fas fa-file-pdf"></i> Apostila Complementar</h3>
                    <div class="status-check">
                        <i class="far fa-square check-icon" id="check-apostila"></i>
                    </div>
                </div>
                
                <div style="text-align: center; padding: 30px 0;">
                    <i class="fas fa-book icone-gigante" style="color: var(--accent-teal); font-size: 4rem; margin-bottom: 20px;"></i>
                    <p style="margin-bottom: 20px;">Leia o material de apoio para fixar o conteúdo da videoaula.</p>
                    <button class="btn bg-teal" onclick="lerApostila()" style="color: var(--primary-blue);">
                        <i class="fas fa-download"></i> Acessar Apostila
                    </button>
                </div>
            </div>

        </div>

        <div style="text-align: center; margin-top: 30px;">
            <button class="btn" style="background: #ccc; color: #333;" onclick="resetarProgresso()">
                <i class="fas fa-sync"></i> Resetar Progresso (Testes)
            </button>
        </div>

    </main>

    <div class="floating-actions">
        <a href="opcoes-unidade.html" class="btn"><i class="fas fa-arrow-left"></i> Voltar</a>
        <button class="btn" onclick="toggleAccessibility()" title="Acessibilidade">
            <i class="fas fa-universal-access"></i> Acessibilidade
        </button>
    </div>

    <script src="script.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            updateNavbarUI();
            // Esta função que está no seu script.js vai ler o localStorage e pintar os checks!
            atualizarStatusMaterial();
            function verificarProgressoInterno() {
    // Material de Estudo
    if (localStorage.getItem('uni1_conteudo') === 'true') {
        marcarCheckbox('check-conteudo');
        desbloquearCard('card-exercicios');
        const txtExe = document.getElementById('txt-exercicios');
        if(txtExe) txtExe.innerText = "(Liberado! Clique para simular/acessar)";
    }

    // Trilha de Exercícios
    if (localStorage.getItem('ex2_done') === 'true' || localStorage.getItem('uni1_exercicios') === 'true') {
        marcarCheckbox('check-exercicios');
        desbloquearCard('card-avaliacao');
        localStorage.setItem('uni1_exercicios', 'true'); 
        const txtAva = document.getElementById('txt-avaliacao');
        if(txtAva) txtAva.innerText = "(Liberado! Clique para fazer a prova)";
    }

    // Avaliação Final
    if (localStorage.getItem('uni1_avaliacao') === 'true') {
        marcarCheckbox('check-avaliacao');
        const txtAva = document.getElementById('txt-avaliacao');
        if(txtAva) txtAva.innerText = "Aprovado! Unidade 2 desbloqueada na trilha.";
    }
}

// Utilitários de Interface
function marcarCheckbox(id) {
    const el = document.getElementById(id);
    if(el) el.className = 'fas fa-check-square check-icon marcado';
}

function desbloquearCard(id) {
    const el = document.getElementById(id);
    if(el) el.classList.remove('locked');
}

// ==========================================
// 5. MATERIAL DE ESTUDO
// ==========================================
function marcarVideoConcluido() {
    if (localStorage.getItem('video_concluido') !== 'true') {
        localStorage.setItem('video_concluido', 'true');
        alert("Ótimo! Você concluiu a videoaula.");
        atualizarStatusMaterial();
    } else {
        alert("Esta aula já está marcada como concluída!");
    }
}

function lerApostila() {
    window.open('https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf', '_blank');
    if (localStorage.getItem('apostila_concluida') !== 'true') {
        localStorage.setItem('apostila_concluida', 'true');
        atualizarStatusMaterial();
    }
}

function atualizarStatusMaterial() {
    const checkVideo = document.getElementById('check-video');
    const checkApostila = document.getElementById('check-apostila');
    
    if(!checkVideo || !checkApostila) return;

    const videoFeito = localStorage.getItem('video_concluido') === 'true';
    const apostilaFeita = localStorage.getItem('apostila_concluida') === 'true';

    if (videoFeito) checkVideo.className = 'fas fa-check-square check-icon marcado';
    if (apostilaFeita) checkApostila.className = 'fas fa-check-square check-icon marcado';

    if (videoFeito && apostilaFeita) {
        if (localStorage.getItem('uni1_conteudo') !== 'true') {
            localStorage.setItem('uni1_conteudo', 'true');
            setTimeout(() => {
                alert("Parabéns! Você concluiu o material de estudo.\nA Trilha de Exercícios foi liberada!");
            }, 500);
        }
    }
}
        });
    </script>
</body>
</html>
