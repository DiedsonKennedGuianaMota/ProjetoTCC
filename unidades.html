<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trilha de Unidades - ALGORITMOLAB</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="app-mode bg-light no-scroll">

    <header class="navbar">
        <div class="nav-profile">
            <div class="avatar" id="user-avatar">A</div>
            <div>
                <strong id="user-name">Aluno</strong>
                <div class="streak-badge">
                    <i class="fas fa-fire"></i> <span id="user-streak">0 Dias</span>
                </div>
            </div>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-outline nav-btn" onclick="abrirConfiguracoes()" title="Configurações">
                <i class="fas fa-cog"></i>
            </button>
            <button class="btn btn-outline nav-btn" onclick="handleLogout()" title="Sair">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </header>

    <main class="container trilha-page-container">
        <h2 style="text-align: left; color: var(--primary-blue); margin-bottom: 50px; margin-left: 20px;">
            <i class="fas fa-route"></i> Trilha: Lógica de Programação
        </h2>
        
        <div class="trilha-feed">
            
            <div class="trilha-item unlocked" id="unidade-1-item">
                <div class="trilha-card-visual">
                    <i class="fas fa-flag map-marker-icon"></i>
                </div>
                <div class="trilha-status-icon">
                    <div class="status-circle">
                        <i class="fas fa-check"></i>
                    </div>
                </div>
                <div class="trilha-text-block">
                    <h3>Unidade 1</h3>
                    <p>Introdução</p>
                </div>
                <div class="trilha-connector">
                    <div class="line"></div>
                    <i class="fas fa-chevron-right arrow-icon"></i>
                </div>
            </div>

            <a href="opcoes-unidade2.html" class="trilha-item locked" id="unidade-2-item">
                <div class="trilha-card-visual">
                    </div>
                <div class="trilha-status-icon">
                    <div class="status-circle locked-icon-container">
                        <i class="fas fa-lock"></i>
                    </div>
                </div>
                <div class="trilha-text-block">
                    <h3>Unidade 2</h3>
                    <p>Condicionais (IF/ELSE)</p>
                </div>
                <div class="trilha-connector locked">
                    <div class="line"></div>
                    <i class="fas fa-chevron-right arrow-icon"></i>
                </div>
            </a>

            <div class="trilha-item locked" id="unidade-3-item">
                <div class="trilha-card-visual">
                    </div>
                <div class="trilha-status-icon">
                    <div class="status-circle locked-icon-container">
                        <i class="fas fa-lock"></i>
                    </div>
                </div>
                <div class="trilha-text-block">
                    <h3>Unidade 3</h3>
                    <p>Pseudocódigo</p>
                </div>
                <div class="trilha-connector locked">
                    <div class="line"></div>
                    <i class="fas fa-chevron-right arrow-icon"></i>
                </div>
            </div>

        </div>
        
        <div style="text-align: center; margin-top: 40px; padding-bottom: 40px;">
            <button class="btn btn-outline" onclick="resetarProgresso()">Resetar Progresso (Testes)</button>
        </div>
    </main>

    <div class="floating-actions">
        <button class="btn" onclick="toggleAccessibility()" title="Acessibilidade">
            <i class="fas fa-universal-access"></i> Acessibilidade
        </button>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', verificarProgressoUnidades);
        /* ==========================================================================
   LÓGICA GERAL & UTILITÁRIOS
   ========================================================================== */
function resetarProgresso() {
    if(confirm("Tem certeza que deseja apagar todo o progresso para testar novamente?")) {
        localStorage.clear();
        location.reload();
    }
}
function abrirConfiguracoes() { alert("Configurações: Painel em desenvolvimento."); }
function handleLogout() { alert("Saindo do sistema..."); }
function toggleAccessibility() { document.body.classList.toggle('alto-contraste'); alert("Modo acessibilidade alternado."); }

/* ==========================================================================
   SISTEMA DA TRILHA PRINCIPAL (unidades.html) - NOVO E CORRIGIDO
   ========================================================================== */
function verificarProgressoUnidades() {
    // 1. Unidade 1 Concluída -> Desbloqueia Unidade 2
    if (localStorage.getItem('unidade1Completed') === 'true') {
        const itemUni2 = document.getElementById('unidade-2-item');
        const connectorUni1 = document.querySelector('#unidade-1-item .trilha-connector');

        if (itemUni2) {
            itemUni2.classList.remove('locked');
            itemUni2.classList.add('unlocked');
            
            // Alterar ícone do cadeado para cadeado aberto
            const iconContainer = itemUni2.querySelector('.status-circle.locked-icon-container');
            if (iconContainer) {
                iconContainer.querySelector('i').className = 'fas fa-unlock';
            }
        }
        
        if (connectorUni1) {
             connectorUni1.classList.remove('locked');
        }
    }

    // 2. Unidade 2 Concluída -> Desbloqueia Unidade 3
    if (localStorage.getItem('uni2_avaliacao') === 'true') { 
        const itemUni3 = document.getElementById('unidade-3-item');
        const connectorUni2 = document.querySelector('#unidade-2-item .trilha-connector');

        if (itemUni3) {
            itemUni3.classList.remove('locked');
            itemUni3.classList.add('unlocked');
            
            const iconContainer = itemUni3.querySelector('.status-circle.locked-icon-container');
            if (iconContainer) {
                iconContainer.querySelector('i').className = 'fas fa-unlock';
            }
        }
        
        if (connectorUni2) {
             connectorUni2.classList.remove('locked');
        }
    }
}
    </script>
</body>
</html>
