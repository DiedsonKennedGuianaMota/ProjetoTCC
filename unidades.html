<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trilha de Unidades - ALGORITMOLAB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="app-mode bg-light">

    <header class="navbar">
        <div class="nav-profile">
            <div class="avatar" id="user-avatar">A</div>
            <div>
                <strong id="user-name">Aluno</strong>
                <div class="streak-badge">
                    <i class="fas fa-fire"></i> <span id="user-streak">0 Dias</span>
                </div>
            </div>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-outline nav-btn" onclick="abrirConfiguracoes()" title="Configurações">
                <i class="fas fa-cog"></i>
            </button>
            <button class="btn btn-outline nav-btn" onclick="handleLogout()" title="Sair">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </header>

    <main class="container trilha-page-container">
        <div style="padding: 20px;">
            <h2 style="color: var(--primary-blue); margin-bottom: 40px;">
                <i class="fas fa-route"></i> Trilha: Lógica de Programação
            </h2>
            
            <div class="trilha-feed">
                
                <a href="opcoes-unidade.html" class="trilha-item unlocked" id="unidade-1">
                    <div class="trilha-card-visual">
                        <i class="fas fa-flag map-marker-icon"></i>
                        <div class="trilha-icon"><i class="fas fa-book-open"></i></div>
                    </div>
                    
                    <div class="status-circle">
                        <i class="fas fa-check"></i>
                    </div>

                    <div class="trilha-text-block">
                        <h3>Unidade 1</h3>
                        <p>Introdução e Algoritmos</p>
                    </div>

                    <div class="trilha-connector" id="linha-1">
                        <div class="line"></div>
                        <i class="fas fa-chevron-right arrow-icon"></i>
                    </div>
                </a>

                <a href="opcoes-unidade.html" class="trilha-item locked" id="unidade-2">
                    <div class="trilha-card-visual">
                        <div class="trilha-icon"><i class="fas fa-lock"></i></div>
                    </div>
                    
                    <div class="status-circle">
                        <i class="fas fa-lock"></i>
                    </div>

                    <div class="trilha-text-block">
                        <h3>Unidade 2</h3>
                        <p>Condicionais (IF/ELSE)</p>
                    </div>

                    <div class="trilha-connector locked">
                        <div class="line"></div>
                        <i class="fas fa-chevron-right arrow-icon"></i>
                    </div>
                </a>

                <div class="trilha-item locked" id="unidade-3">
                    <div class="trilha-card-visual">
                        <div class="trilha-icon"><i class="fas fa-lock"></i></div>
                    </div>
                    
                    <div class="status-circle">
                        <i class="fas fa-lock"></i>
                    </div>

                    <div class="trilha-text-block">
                        <h3>Unidade 3</h3>
                        <p>Estruturas de Repetição</p>
                    </div>
                </div>

            </div>
            
            <div style="text-align: center; margin-top: 60px;">
                <button class="btn" style="background: #ccc; color: #333;" onclick="resetarProgresso()">
                    <i class="fas fa-sync"></i> Resetar Tudo (Para Testes)
                </button>
            </div>
        </div>
    </main>

    <div class="floating-actions">
        <button class="btn" onclick="toggleAccessibility()">
            <i class="fas fa-universal-access"></i> Acessibilidade
        </button>
    </div>

    <script src="script.js"></script>
    <script>
        // Garante que o sistema verifique o progresso assim que a página carregar
        document.addEventListener('DOMContentLoaded', () => {
            updateNavbarUI();
            verificarProgressoUnidades();
        });
    </script>
</body>
</html>
