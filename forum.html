<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fórum de Discussão - ALGORITMOLAB</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <header class="navbar">
        <div class="nav-profile">
            <div class="avatar" id="user-avatar">A</div>
            <div>
                <strong id="user-name">Aluno</strong>
                <div class="streak-badge">
                    <i class="fas fa-fire"></i> <span id="user-streak">0 Dias</span>
                </div>
            </div>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-outline" onclick="abrirConfiguracoes()" style="background: transparent; color: var(--primary-blue); box-shadow: none; border: 2px solid var(--primary-blue);" title="Configurações">
                <i class="fas fa-cog"></i>
            </button>
            <button class="btn btn-outline" onclick="handleLogout()" style="background: transparent; color: var(--primary-blue); box-shadow: none; border: 2px solid var(--primary-blue);" title="Sair">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </header>

    <main class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 style="color: var(--primary-blue); margin: 0;">
                <i class="fas fa-comments"></i> Fórum da Comunidade
            </h2>
            <button class="btn bg-teal btn-animate pulse-anim" onclick="abrirModalPost()" style="color: var(--primary-blue); padding: 12px 20px;">
                <i class="fas fa-pen"></i> Nova Publicação
            </button>
        </div>

        <div id="forum-feed" class="forum-feed-container">
            </div>

    </main>

    <div class="floating-actions" style="z-index: 50;">
        <a href="opcoes-unidade.html" class="btn"><i class="fas fa-arrow-left"></i> Voltar</a>
    </div>

    <div id="modal-post" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-edit"></i> Criar Publicação</h3>
                <button class="btn-close" onclick="fecharModalPost()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <textarea id="novo-post-texto" placeholder="Tem alguma dúvida, dica ou código para compartilhar com a turma? Escreva aqui..." class="form-input custom-scrollbar"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn bg-dark" onclick="fecharModalPost()">Cancelar</button>
                <button class="btn bg-teal" onclick="criarPost()" style="color: var(--primary-blue);">
                    <i class="fas fa-paper-plane"></i> Publicar
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="forum.js"></script>
</body>
</html>
